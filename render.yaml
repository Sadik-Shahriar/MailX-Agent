services:
  - type: web
    name: mailx-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ZEN_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: MAILX_EXTENSION_ORIGINS
        sync: false
